services:
  db:
    image: postgres:18
    container_name: food_ordering_db
    restart: always
    environment:
      POSTGRES_USER: fooduser
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: food_ordering
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: